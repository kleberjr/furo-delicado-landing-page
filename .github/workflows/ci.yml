name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar (lockfile)
        run: npm ci

      - name: Auditoria de dependências de produção
        run: npm audit --omit=dev --audit-level=high

      - name: Lint (ESLint, Prettier)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Testes unitários
        run: npm run test:unit

      - name: Build de produção (falha com placeholders)
        run: npm run build

      - name: Instalar Chromium do Playwright
        run: npx playwright install --with-deps chromium

      - name: Testes e2e (Playwright + axe)
        run: npm run test:e2e

      - name: Lighthouse CI
        run: npm run lighthouse

      - name: Relatórios
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: relatorios
          path: |
            playwright-report/
            test-results/
            .lighthouseci/
          retention-days: 7
